<!doctype html>
<html lang="en" data-theme="{{ theme_preference if theme_preference in ('light', 'dark') else 'dark' }}" data-theme-preference="{{ theme_preference if theme_preference in ('light', 'dark') else 'dark' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050B18">
    <meta name="description" content="MailPilot bulk email workspace dashboard">
    <title>{% block title %}MailPilot{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/shell.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}" defer></script>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
